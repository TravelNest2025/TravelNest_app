name: POI Data Crawler (Single City)

on:
  
  # 手动触发
  workflow_dispatch:
    inputs:
      city:
        description: '城市名称（如: paris, london, tokyo）'
        required: false
        default: 'paris'
      skip_crawl:
        description: '跳过爬取，只重试写入（true/false）'
        required: false
        default: 'false'

env:
  PYTHON_VERSION: '3.11'
  WORKING_DIR: 'scrawler_V2'

jobs:
  # ============================================
  # Job 1: 爬取数据
  # ============================================
  crawl:
    name: 爬取 ${{ github.event.inputs.city || 'paris' }}
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: scrawler_V2
    
    if: github.event.inputs.skip_crawl != 'true'
    
    steps:
      - name: Checkout代码
        uses: actions/checkout@v4
      
      - name: 设置Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: '${{ env.WORKING_DIR }}/requirements.txt'
      
      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 创建缓存目录
        run: mkdir -p cache
      
      - name: 爬取城市
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CITY: ${{ github.event.inputs.city || 'paris' }}
        run: |
          echo "🚀 开始爬取: $CITY"
          python src/crawler.py $CITY cache/${CITY}.json
          
          if [ -f "cache/${CITY}.json" ]; then
            echo "✅ 爬取成功: cache/${CITY}.json"
            
            echo "📊 数据统计:"
            echo "  餐厅: $(jq '.restaurants | length' cache/${CITY}.json)"
            echo "  景点: $(jq '.attractions | length' cache/${CITY}.json)"
            echo "  酒店: $(jq '.hotels | length' cache/${CITY}.json)"
          else
            echo "❌ 爬取失败: 未生成JSON文件"
            exit 1
          fi
      
      - name: 上传爬取结果到Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: poi-cache-${{ github.event.inputs.city || 'paris' }}
          path: ${{ env.WORKING_DIR }}/cache/${{ github.event.inputs.city || 'paris' }}.json
          retention-days: 30
          if-no-files-found: error
  
  # ============================================
  # Job 2: 写入数据库
  # ============================================
  write:
    name: 写入 ${{ github.event.inputs.city || 'paris' }}
    runs-on: ubuntu-latest
    needs: crawl
    
    defaults:
      run:
        working-directory: scrawler_V2
    
    # 🔴 修改点 1: 强制运行逻辑
    # 含义: 只要没有被取消，且 (Job1成功了 或者 我们主动跳过了Job1)，就运行 Job2
    if: ${{ !cancelled() && (needs.crawl.result == 'success' || github.event.inputs.skip_crawl == 'true') }}
    
    steps:
      - name: Checkout代码
        uses: actions/checkout@v4
      
      - name: 设置Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: '${{ env.WORKING_DIR }}/requirements.txt'
      
      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 创建缓存目录
        run: mkdir -p cache
      
      # 🔴 修改点 2: 智能下载 Artifact
      
      # 情况 A: 爬虫跑了 (当前 Run 有数据)
      - name: 下载当前运行的爬取结果
        if: needs.crawl.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: poi-cache-${{ github.event.inputs.city || 'paris' }}
          path: ${{ env.WORKING_DIR }}/cache/

      # 情况 B: 爬虫跳过了 (去下载最近一次成功的 Run 的数据)
      - name: 下载上一次成功的爬取结果
        if: github.event.inputs.skip_crawl == 'true'
        uses: dawidd6/action-download-artifact@v6
        with:
          # 你的 Workflow 文件名 (去 .github/workflows/ 里看文件名，比如 main.yml 或 crawler.yml)
          workflow: POI_Data_Crawler (Single_City).yml  
          name: poi-cache-${{ github.event.inputs.city || 'paris' }}
          path: ${{ env.WORKING_DIR }}/cache/
          search_artifacts: true # 搜索所有 Artifacts
          if_no_artifact_found: fail
      
      - name: 写入数据库
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CITY: ${{ github.event.inputs.city || 'paris' }}
        run: |
          echo "💾 开始写入: $CITY"
          python src/writer.py --cache-file cache/${CITY}.json
          
          if [ $? -eq 0 ]; then
            echo "✅ 写入成功: $CITY"
          else
            echo "❌ 写入失败: $CITY"
            exit 1
          fi
      
      - name: 上传失败记录
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-writes-${{ github.event.inputs.city || 'paris' }}
          path: ${{ env.WORKING_DIR }}/cache/failed_writes.json
          retention-days: 30
          if-no-files-found: ignore
