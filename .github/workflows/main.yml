name: POI Data Collection Pipeline

on:
  schedule:
    # 每周一凌晨2点(UTC)运行
    - cron: '0 2 * * 1'
  
  workflow_dispatch:
    # 允许手动触发

jobs:
  collect-and-sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./your-default-directory
    
    permissions:
      contents: 'read'
      id-token: 'write'
    
    steps:
      # ========================================
      # 1. 环境准备
      # ========================================
      
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # ========================================
      # 2. 数据采集（Google Maps + Qwen AI）
      # ========================================
      
      - name: Run POI Data Collection
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
        run: |
          cd src
          python maps_calling.py
        
        # 如果采集失败，不继续后续步骤
        continue-on-error: false
      
      # ========================================
      # 3. Google Cloud认证
      # ========================================
      
      - name: Authenticate to Google Cloud
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
      
      # ========================================
      # 4. 启动Cloud SQL Auth Proxy
      # ========================================
      
      - name: Download Cloud SQL Auth Proxy
        run: |
          wget https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.8.2/cloud-sql-proxy.linux.amd64 -O cloud-sql-proxy
          chmod +x cloud-sql-proxy
      
      - name: Start Cloud SQL Auth Proxy
        run: |
          ./cloud-sql-proxy ${{ secrets.GCSQL_INSTANCE_NAME }} &
          PROXY_PID=$!
          echo "PROXY_PID=$PROXY_PID" >> $GITHUB_ENV
          
          # 等待代理就绪（带健康检查）
          echo "Waiting for Cloud SQL Proxy to be ready..."
          for i in {1..30}; do
            if nc -z 127.0.0.1 5432 2>/dev/null; then
              echo "✅ Cloud SQL Proxy is ready"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "❌ Cloud SQL Proxy failed to start"
              kill $PROXY_PID 2>/dev/null || true
              exit 1
            fi
            echo "Attempt $i/30: waiting..."
            sleep 2
          done
      
      # ========================================
      # 5. 数据同步到数据库
      # ========================================
      
      - name: Sync Data to Cloud SQL
        env:
          DB_HOST: "127.0.0.1"
          DB_PORT: "5432"
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          cd src
          python sync_to_db.py
      
      # ========================================
      # 6. 清理
      # ========================================
      
      - name: Cleanup
        if: always()
        run: |
          # 停止Cloud SQL Proxy
          if [ ! -z "$PROXY_PID" ]; then
            kill $PROXY_PID 2>/dev/null || true
            echo "Cloud SQL Proxy stopped"
          fi
          
          # 删除敏感文件
          rm -f src/*_comprehensive_database.json
          rm -f cloud-sql-proxy
      
      # ========================================
      # 7. 上传结果（可选，用于调试）
      # ========================================
      
      - name: Upload collection summary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: collection-summary
          path: src/*_comprehensive_database.json
          retention-days: 7
