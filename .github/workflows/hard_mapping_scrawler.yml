# ===== 修正方案1: 单行版本（最简单）=====

- name: 爬取 ${{ matrix.city }}
  env:
    GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
    SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  run: |
    echo "🚀 开始爬取: ${{ matrix.city }}"
    python src/crawler.py ${{ matrix.city }} cache/${{ matrix.city }}.json
    
    # 验证爬取结果
    if [ -f "cache/${{ matrix.city }}.json" ]; then
      echo "✅ 爬取成功: cache/${{ matrix.city }}.json"
      
      # 显示统计信息（单行版本）
      python -c "import json; data = json.load(open('cache/${{ matrix.city }}.json')); print('📊 数据统计:'); print(f'  餐厅: {len(data.get(\"restaurants\", []))}'); print(f'  景点: {len(data.get(\"attractions\", []))}'); print(f'  酒店: {len(data.get(\"hotels\", []))}')"
    else
      echo "❌ 爬取失败: 未生成JSON文件"
      exit 1
    fi

# ===== 修正方案2: 多行版本（更易读）=====

- name: 爬取 ${{ matrix.city }}
  env:
    GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
    SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  run: |
    echo "🚀 开始爬取: ${{ matrix.city }}"
    python src/crawler.py ${{ matrix.city }} cache/${{ matrix.city }}.json
    
    # 验证爬取结果
    if [ -f "cache/${{ matrix.city }}.json" ]; then
      echo "✅ 爬取成功: cache/${{ matrix.city }}.json"
      
      # 显示统计信息（多行版本）
      python -c '
import json
with open("cache/${{ matrix.city }}.json") as f:
    data = json.load(f)
print("📊 数据统计:")
print(f"  餐厅: {len(data.get(\"restaurants\", []))}")
print(f"  景点: {len(data.get(\"attractions\", []))}")
print(f"  酒店: {len(data.get(\"hotels\", []))}")
      '
    else
      echo "❌ 爬取失败: 未生成JSON文件"
      exit 1
    fi

# ===== 修正方案3: 使用jq（最优雅）=====

- name: 爬取 ${{ matrix.city }}
  env:
    GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
    SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  run: |
    echo "🚀 开始爬取: ${{ matrix.city }}"
    python src/crawler.py ${{ matrix.city }} cache/${{ matrix.city }}.json
    
    # 验证爬取结果
    if [ -f "cache/${{ matrix.city }}.json" ]; then
      echo "✅ 爬取成功: cache/${{ matrix.city }}.json"
      
      # 显示统计信息（使用jq）
      echo "📊 数据统计:"
      echo "  餐厅: $(jq '.restaurants | length' cache/${{ matrix.city }}.json)"
      echo "  景点: $(jq '.attractions | length' cache/${{ matrix.city }}.json)"
      echo "  酒店: $(jq '.hotels | length' cache/${{ matrix.city }}.json)"
    else
      echo "❌ 爬取失败: 未生成JSON文件"
      exit 1
    fi
