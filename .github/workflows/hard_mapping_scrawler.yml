name: POI Data Collection

on:
  workflow_dispatch:
    inputs:
      city_id:
        description: 'City ID to collect (e.g., paris)'
        required: true
        default: 'paris'
      poi_type:
        description: 'POI type to collect'
        required: true
        type: choice
        options:
          - restaurants
          - attractions
          - hotels
          - all
      limit:
        description: 'Maximum number of POIs to collect (0 = no limit)'
        required: false
        default: '100'

jobs:
  collect-pois:
    runs-on: ubuntu-latest
    
    # ⭐ 设置默认工作目录
    defaults:
      run:
        working-directory: scrawler_V2
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          # ⭐ 修正：正确的 requirements.txt 路径
          key: ${{ runner.os }}-pip-${{ hashFiles('scrawler_V2/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Cloud SQL Proxy
        # ⭐ Cloud SQL Proxy 需要在根目录运行
        working-directory: .
        run: |
          wget https://dl.google.com/cloudsql/cloud_sql_proxy.linux.amd64 -O cloud_sql_proxy
          chmod +x cloud_sql_proxy
          ./cloud_sql_proxy -instances=${{ secrets.GCSQL_INSTANCE_NAME }}=tcp:5432 &
          sleep 5
      
      - name: Run POI collection
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          CITY_ID: ${{ github.event.inputs.city_id || 'paris' }}
          POI_TYPE: ${{ github.event.inputs.poi_type || 'all' }}
          LIMIT: ${{ github.event.inputs.limit || '100' }}
        run: |
          echo "📁 Current directory: $(pwd)"
          echo "📂 Directory contents:"
          ls -la
          echo ""
          echo "🚀 Starting POI collection..."
          echo "   - City: $CITY_ID"
          echo "   - Type: $POI_TYPE"
          echo "   - Limit: $LIMIT"
          echo ""
          
          python -m src.collector \
            --city-id "$CITY_ID" \
            --poi-type "$POI_TYPE" \
            --limit "$LIMIT"
      
      - name: Collection Summary
        if: always()
        run: |
          echo "## 📊 Collection Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| City | ${{ github.event.inputs.city_id }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Type | ${{ github.event.inputs.poi_type }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Limit | ${{ github.event.inputs.limit }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Check the run logs above for detailed results." >> $GITHUB_STEP_SUMMARY
