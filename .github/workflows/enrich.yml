on:
  workflow_dispatch:

jobs:
  enrich-tags:
    runs-on: ubuntu-latest
    
    permissions:
      contents: 'read'
      id-token: 'write'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary googlemaps openai
      
      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
      
      - name: Download Cloud SQL Auth Proxy
        run: |
          wget https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.8.2/cloud-sql-proxy.linux.amd64 -O cloud-sql-proxy
          chmod +x cloud-sql-proxy
      
      - name: Start Cloud SQL Auth Proxy
        run: |
          ./cloud-sql-proxy ${{ secrets.GCSQL_INSTANCE_NAME }} &
          PROXY_PID=$!
          echo "PROXY_PID=$PROXY_PID" >> $GITHUB_ENV
          
          echo "⏳ Waiting for Cloud SQL Proxy..."
          for i in {1..30}; do
            if nc -z 127.0.0.1 5432 2>/dev/null; then
              echo "✅ Proxy ready!"
              break
            fi
            [ $i -eq 30 ] && echo "❌ Timeout!" && exit 1
            sleep 2
          done
      
      - name: Run Tag Enrichment
        working-directory: ./poi_scrawler/enrichment
        env:
          DB_HOST: "127.0.0.1"
          DB_PORT: "5432"
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
        run: |
          echo "🏷️  Starting enrichment..."
          python enrich_tags_with_ai.py
      
      - name: Cleanup
        if: always()
        run: |
          [ ! -z "$PROXY_PID" ] && kill $PROXY_PID 2>/dev/null || true
          rm -f cloud-sql-proxy
          echo "✅ Cleanup completed"
      
      - name: Summary
        if: always()
        run: |
          echo ""
          echo "======================================"
          echo "📊 Enrichment Complete"
          echo "======================================"
