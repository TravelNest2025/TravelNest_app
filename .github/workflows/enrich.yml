on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Enrichment mode'
        required: true
        type: choice
        default: 'rule-based'
        options:
          - rule-based
          - ai-enhanced
          - both

jobs:
  enrich-tags:
    runs-on: ubuntu-latest
    
    permissions:
      contents: 'read'
      id-token: 'write'
    
    steps:
      # ========================================
      # 1. 环境准备
      # ========================================
      
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary googlemaps openai
      
      # ========================================
      # 2. Google Cloud 认证
      # ========================================
      
      - name: Authenticate to Google Cloud
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
      
      # ========================================
      # 3. 启动 Cloud SQL Auth Proxy
      # ========================================
      
      - name: Download Cloud SQL Auth Proxy
        run: |
          wget https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.8.2/cloud-sql-proxy.linux.amd64 -O cloud-sql-proxy
          chmod +x cloud-sql-proxy
      
      - name: Start Cloud SQL Auth Proxy
        run: |
          ./cloud-sql-proxy ${{ secrets.GCSQL_INSTANCE_NAME }} &
          PROXY_PID=$!
          echo "PROXY_PID=$PROXY_PID" >> $GITHUB_ENV
          
          # 等待代理就绪
          echo "⏳ Waiting for Cloud SQL Proxy to be ready..."
          for i in {1..30}; do
            if nc -z 127.0.0.1 5432 2>/dev/null; then
              echo "✅ Cloud SQL Proxy is ready (attempt $i)"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "❌ Cloud SQL Proxy failed to start after 30 attempts"
              kill $PROXY_PID 2>/dev/null || true
              exit 1
            fi
            echo "   Attempt $i/30: waiting..."
            sleep 2
          done
      
      # ========================================
      # 4. 验证目录结构
      # ========================================
      
      - name: Verify directory structure
        run: |
          echo "📁 Current directory: $(pwd)"
          echo ""
          echo "📁 Repository root contents:"
          ls -la
          echo ""
          echo "📁 poi_scrawler contents:"
          ls -la poi_scrawler/
          echo ""
          echo "📁 enrichment contents:"
          ls -la poi_scrawler/enrichment/
      
      # ========================================
      # 5. 运行规则映射增强
      # ========================================
      
      - name: Run Rule-Based Enrichment
        if: ${{ github.event.inputs.mode == 'rule-based' || github.event.inputs.mode == 'both' }}
        working-directory: ./poi_scrawler/enrichment
        env:
          DB_HOST: "127.0.0.1"
          DB_PORT: "5432"
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          echo ""
          echo "======================================"
          echo "🏷️  Rule-Based Enrichment"
          echo "======================================"
          
          # 调试：打印连接信息（不打印密码）
          echo "🔍 Connection details:"
          echo "   Host: $DB_HOST"
          echo "   Port: $DB_PORT"
          echo "   Database: $DB_NAME"
          echo "   User: $DB_USER"
          echo ""
          
          python enrich_tags_from_types.py
      
      # ========================================
      # 6. 运行 AI 增强
      # ========================================
      
      - name: Run AI Enhancement
        if: ${{ github.event.inputs.mode == 'ai-enhanced' || github.event.inputs.mode == 'both' }}
        working-directory: ./poi_scrawler/enrichment
        env:
          DB_HOST: "127.0.0.1"
          DB_PORT: "5432"
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
        run: |
          echo ""
          echo "======================================"
          echo "🤖 AI-Powered Enhancement"
          echo "======================================"
          python enrich_tags_with_ai.py
      
      # ========================================
      # 7. 清理
      # ========================================
      
      - name: Cleanup
        if: always()
        run: |
          # 停止 Cloud SQL Proxy
          if [ ! -z "$PROXY_PID" ]; then
            kill $PROXY_PID 2>/dev/null || true
            echo "🔌 Cloud SQL Proxy stopped"
          fi
          
          # 删除代理文件
          rm -f cloud-sql-proxy
          
          echo "🧹 Cleanup completed"
      
      # ========================================
      # 8. 报告结果
      # ========================================
      
      - name: Summary
        if: always()
        run: |
          echo ""
          echo "======================================"
          echo "📊 Enrichment Summary"
          echo "======================================"
          echo "Mode: ${{ github.event.inputs.mode }}"
          echo "Workflow: Completed"
          echo "Run number: ${{ github.run_number }}"
          echo "======================================"
