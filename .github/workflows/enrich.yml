on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Enrichment mode'
        required: true
        type: choice
        default: 'rule-based'
        options:
          - rule-based
          - ai-enhanced
          - both

jobs:
  enrich-tags:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install psycopg2-binary googlemaps openai
      
      - name: Download Cloud SQL Auth Proxy
        run: |
          wget https://dl.google.com/cloudsql/cloud_sql_proxy.linux.amd64 -O cloud_sql_proxy
          chmod +x cloud_sql_proxy
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Start Cloud SQL Proxy
        run: |
          echo "🚀 Starting Cloud SQL Proxy..."
          
          # 启动 Cloud SQL Proxy（明确指定端口映射）
          ./cloud_sql_proxy \
            --port=5432 \
            ${{ secrets.DB_INSTANCE_CONNECTION_NAME }} &
          
          PROXY_PID=$!
          echo "Cloud SQL Proxy PID: $PROXY_PID"
          
          # 等待代理启动
          echo "⏳ Waiting for proxy to be ready..."
          for i in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 5432 2>/dev/null; then
              echo "✅ Cloud SQL Proxy is ready!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "❌ Timeout waiting for Cloud SQL Proxy"
              exit 1
            fi
            echo "   Attempt $i/30..."
            sleep 2
          done
          
          # 验证连接
          echo "🔍 Testing connection..."
          nc -zv 127.0.0.1 5432 || echo "⚠️  Port not responding"
      
      - name: Verify directory structure
        run: |
          echo "📁 Current directory: $(pwd)"
          echo ""
          echo "📁 Repository root contents:"
          ls -la
          echo ""
          echo "📁 poi_scrawler contents:"
          ls -la poi_scrawler/
          echo ""
          echo "📁 enrichment contents:"
          ls -la poi_scrawler/enrichment/
      
      - name: Run Rule-Based Enrichment
        if: ${{ github.event.inputs.mode == 'rule-based' || github.event.inputs.mode == 'both' }}
        working-directory: ./poi_scrawler/enrichment
        env:
          DB_HOST: "127.0.0.1"
          DB_PORT: "5432"
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          echo ""
          echo "======================================"
          echo "🏷️  Rule-Based Enrichment"
          echo "======================================"
          
          # 调试：打印连接信息（不打印密码）
          echo "🔍 Connection details:"
          echo "   Host: $DB_HOST"
          echo "   Port: $DB_PORT"
          echo "   Database: $DB_NAME"
          echo "   User: $DB_USER"
          echo ""
          
          python enrich_tags_from_types.py
      
      - name: Run AI Enhancement
        if: ${{ github.event.inputs.mode == 'ai-enhanced' || github.event.inputs.mode == 'both' }}
        working-directory: ./poi_scrawler/enrichment
        env:
          DB_HOST: "127.0.0.1"
          DB_PORT: "5432"
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
        run: |
          echo ""
          echo "======================================"
          echo "🤖 AI-Powered Enhancement"
          echo "======================================"
          python enrich_tags_with_ai.py
      
      - name: Cleanup
        if: always()
        run: |
          echo "🧹 Stopping Cloud SQL Proxy..."
          pkill -f cloud_sql_proxy || true
          echo "✅ Cleanup completed"
      
      - name: Summary
        if: always()
        run: |
          echo ""
          echo "======================================"
          echo "📊 Enrichment Summary"
          echo "======================================"
          echo "Mode: ${{ github.event.inputs.mode }}"
          echo "Workflow: Completed"
          echo "======================================"
